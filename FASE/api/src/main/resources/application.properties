spring.application.name=fase-api
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fase_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

fase.cors.allowed-origin=${FASE_CORS_ORIGIN:http://127.0.0.1:5500}
fase.admin.username=${FASE_ADMIN_USERNAME:}
fase.admin.password=${FASE_ADMIN_PASSWORD:}
